<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nightstand: Work calendar view (mockup)</title>
<!-- Sample "now" = Tue 24 Nov, 10:35.

  Mockup of the "Work calendar" page. 915x412 CSS px = S26 Ultra landscape.
  Add class "night" to <body> for red night mode (single hue #FF3B1F; hierarchy only via opacity).
  Font: system rounded/heavy sans (SF Pro Rounded / Nunito fallback / sans-serif); on Android
  this maps to Typeface.create("sans-serif", 900) or a bundled rounded font.
-->
<style>
  :root{
    --bg:#000; --fg:#F5F5F7; --dim:#8E8E93; --faint:#3A3A3C;
    --teams:#7B83EB; --outlook:#3A96DD; --now:#30D158; --next:#FF9F0A; --card:#1C1C1E;
  }
  body.night{
    --fg:#FF3B1F; --dim:rgba(255,59,31,.62); --faint:rgba(255,59,31,.28);
    --teams:#FF3B1F; --outlook:#FF3B1F; --now:#FF3B1F; --next:#FF3B1F; --card:rgba(255,59,31,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:915px;height:412px;background:var(--bg);overflow:hidden}
  body{
    font-family:"SF Pro Rounded","Nunito","Varela Round","Arial Rounded MT Bold",system-ui,sans-serif;
    color:var(--fg); display:grid; grid-template-columns:470px 1fr; gap:28px;
    padding:30px 38px 26px 44px; -webkit-font-smoothing:antialiased;
  }
  /* ---------- left: the NEXT meeting, huge ---------- */
  .hero{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
  .label{font-size:21px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--next)}
  .label .in{color:var(--fg)}
  .time{font-size:132px;font-weight:900;line-height:.9;letter-spacing:-.04em;margin-top:6px;font-variant-numeric:tabular-nums}
  .title{font-size:44px;font-weight:850;line-height:1.05;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{display:flex;align-items:center;gap:14px;margin-top:14px;font-size:22px;font-weight:700;color:var(--dim)}
  .pill{display:inline-flex;align-items:center;gap:9px;padding:7px 16px 7px 12px;border-radius:999px;
        background:var(--card);color:var(--teams);font-size:21px;font-weight:800}
  .pill svg{width:22px;height:22px}
  .join{color:var(--fg);background:transparent;border:3px solid var(--faint);padding:5px 15px}
  .nowbar{display:flex;flex-direction:column;gap:9px}
  .nowbar .txt{display:flex;justify-content:space-between;font-size:20px;font-weight:800;color:var(--dim)}
  .nowbar .txt b{color:var(--now)}
  .track{height:8px;border-radius:4px;background:var(--faint);overflow:hidden}
  .track i{display:block;height:100%;width:67%;background:var(--now);border-radius:4px}
  /* ---------- right: today's agenda ---------- */
  .agenda{display:flex;flex-direction:column;min-width:0}
  .day{display:flex;justify-content:space-between;align-items:baseline;font-size:21px;font-weight:800;color:var(--dim);
       text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
  .day b{color:var(--fg)}
  .row{display:grid;grid-template-columns:8px 86px minmax(0,1fr);column-gap:16px;align-items:center;padding:11px 0;
       border-top:2px solid var(--faint)}
  .row:first-of-type{border-top:none}
  .bar{width:8px;height:46px;border-radius:4px;background:var(--outlook)}
  .bar.teams{background:var(--teams)}
  .row .t{font-size:27px;font-weight:850;font-variant-numeric:tabular-nums}
  .row .n{font-size:27px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
  .row .s{font-size:17px;font-weight:700;color:var(--dim);margin-top:2px}
  .row > div{min-width:0}
  .row.past{opacity:.38}
  .row.now .t, .row.now .n{color:var(--now)}
  .row.now .s{color:var(--now);opacity:.85}
  .more{margin-top:auto;font-size:18px;font-weight:700;color:var(--dim)}
</style>
</head>
<body>
  <section class="hero">
    <div>
      <div class="label">Next <span class="in">· in 25 min</span></div>
      <div class="time">11:00</div>
      <div class="title">Design review</div>
      <div class="meta">
        <span>11:00 – 11:45</span>
        <span class="pill">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h8A2.5 2.5 0 0 1 16 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-8A2.5 2.5 0 0 1 3 17.5zM17.5 9.2l3.2-2.1c.5-.3 1.3 0 1.3.7v8.4c0 .7-.8 1-1.3.7l-3.2-2.1z"/></svg>
          Teams
        </span>
        <span class="pill join">Tap to join</span>
      </div>
    </div>
    <div class="nowbar">
      <div class="txt"><span><b>Now</b> · 1:1 with Anna</span><span>10 min left</span></div>
      <div class="track"><i></i></div>
    </div>
  </section>

  <section class="agenda">
    <div class="day"><b>Today</b><span>Tue 24 Nov</span></div>
    <div class="row past"><div class="bar teams"></div><div class="t">9:30</div>
      <div><div class="n">Weekly sync</div><div class="s">Teams · 30 min</div></div></div>
    <div class="row now"><div class="bar teams" style="background:var(--now)"></div><div class="t">10:15</div>
      <div><div class="n">1:1 with Anna</div><div class="s">Now · ends 10:45</div></div></div>
    <div class="row"><div class="bar teams"></div><div class="t">11:00</div>
      <div><div class="n">Design review</div><div class="s">Teams · 45 min</div></div></div>
    <div class="row"><div class="bar"></div><div class="t">14:00</div>
      <div><div class="n">Quarterly planning</div><div class="s">Room 4.12 · 1 h</div></div></div>
    <div class="more">+2 more · last ends 17:30</div>
  </section>
</body>
</html>
