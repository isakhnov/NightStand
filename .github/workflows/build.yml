# Builds and tests every push / pull request. When you publish a GitHub
# release tagged vX.Y, it builds the signed release APK and attaches it
# to that release (which the app's "Update available" card then offers).
#
# One-time setup: Settings → Secrets and variables → Actions → New secret
#   NIGHTSTAND_KEYSTORE_B64 = base64 of signing/nightstand.keystore
#   (macOS: base64 -i nightstand.keystore | pbcopy)
# Without it, release APKs fall back to a throwaway key and will NOT install
# over the app on your phone — the job stops with an error instead.
name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # upload the APK to the release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;34.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key (releases only)
        if: github.event_name == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.NIGHTSTAND_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret NIGHTSTAND_KEYSTORE_B64 is missing — see the comment at the top of this file."
            exit 1
          fi
          mkdir -p signing
          echo "$KEYSTORE_B64" | base64 -d > signing/nightstand.keystore

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: nightstand-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Attach APK to the release
        if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "nightstand-${TAG#v}.apk"
          gh release upload "$TAG" "nightstand-${TAG#v}.apk" --clobber
